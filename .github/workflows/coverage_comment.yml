name: Post Coverage Comment

on:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR Data
        id: pr
        run: |
          echo "number=$(cat pr_number.txt)" >> $GITHUB_OUTPUT

      - name: Post or Update Coverage Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Find the bot's previous comment using the marker
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -H "Accept: application/vnd.github+json" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- coverage-comment -->"))) | .id' | head -n 1)

          # If a comment exists, update it. Otherwise, create a new one.
          if [ -n "$COMMENT_ID" ]; then
            echo "Found existing comment ID: $COMMENT_ID. Updating..."
            gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID \
              -X PATCH \
              -f body=@coverage_comment.txt
          else
            echo "No existing comment found. Creating a new one..."
            gh pr comment $PR_NUMBER -F coverage_comment.txt
          fi