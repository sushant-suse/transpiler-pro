[project]
name = "transpiler-pro"
version = "1.0.0"
description = "Enterprise MD-to-ADOC conversion pipeline with SUSE learning engine"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Sushant Gaurav", email = "sushant-gaurav@suse.com"}]
keywords = ["documentation", "asciidoc", "markdown", "nlp", "vale", "suse"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "spacy>=3.7.0",
    "pytest>=9.0.3",
    "requests>=2.33.0",
    "pyyaml>=6.0.3",
    "markdown2>=2.5.5",
]

[project.urls]
Homepage = "https://github.com/your-username/transpiler-pro"
Documentation = "https://your-username.github.io/transpiler-pro/"

[project.scripts]
transpiler-pro = "transpiler_pro.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest-cov>=5.0.0",
    "pip-audit>=2.7.0",
    "ruff>=0.3.0",
    "pdoc>=14.0.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.transpiler-pro.pipeline]
supported_extensions = [".md", ".mdx"]
knowledge_base = "data/knowledge_base.json"
official_style_guide = "https://github.com/openSUSE/suse-vale-styleguide.git"

[tool.transpiler-pro.grammar]
special_verbs = { "setup" = "setting up", "stop" = "stopping", "check" = "checking", "reboot" = "rebooting", "backup" = "backing up", "fix" = "fixing", "finish" = "finishing" }

[tool.transpiler-pro.linter]
styles = ["Vale", "common", "asciidoc", "config"]
min_alert_level = "suggestion"
supported_formats = ["adoc", "md"]
report_title = "SUSE Style Guide Validation Report"
theme = { error = "red", warning = "yellow", suggestion = "blue" }

[tool.transpiler-pro.patterns]
suggestion_extraction = "['\"‘“’\u2018\u2019\u201c\u201d](.*?)['\"’\u2018\u2019\u201c\u201d]"
instead_of_trigger = "instead of"
removal_trigger = "removing"

[tool.transpiler-pro.conversions]
extension_map = { md = "adoc", mdx = "adoc" }
path_normalization = [{ regex = "^\\./", replacement = "" }]

# PHASE 1: SHIELDING
# Removed JSX regex to prevent conflict with Python Loop, kept Admonition and Details.
shielding_patterns = [
    { regex = "(?m)^:::", replacement = "SHIELD_ADMON_MARK" },
    { regex = "<details(.*?)>", replacement = "SHIELD_DETAILS_START" },
    { regex = "</details>", replacement = "SHIELD_DETAILS_END" },
    { regex = "<summary(.*?)>", replacement = "SHIELD_SUMMARY_START" },
    { regex = "</summary>", replacement = "SHIELD_SUMMARY_END" }
]

# PHASE 2: RESTORATION
restoration_patterns = [
    { regex = "SHIELD_ADMON_MARK", replacement = ":::" },
    { regex = "SHIELD_DETAILS_START", replacement = "<details>" },
    { regex = "SHIELD_DETAILS_END", replacement = "</details>" },
    { regex = "SHIELD_SUMMARY_START", replacement = "<summary>" },
    { regex = "SHIELD_SUMMARY_END", replacement = "</summary>" }
]

# PHASE 3: CLEANUP (PRESERVED ALL CRASH-FIXING RULES)
cleanup_regex = [
    # 1. Technical Recovery (Reclaims strings from Pandoc's ++ jail)
    { regex = "(?<!\\+)\\+\\+([a-zA-Z0-9_\\$\\-\\.\\*]+)\\+\\+(?!\\+)", replacement = "\\1", flags = "M" },

    # 2. Path & Underscore Repair (Fixes APPLICATION_ID)
    { regex = "([A-Z0-9]+)\\+\\+\\_\\+\\+([A-Z0-9]+)", replacement = "\\1_\\2", flags = "M" },

    # 3. HTML Entity Recovery (Essential for Parity Audit)
    { regex = "&#x27;", replacement = "'", flags = "M" },
    { regex = "&quot;", replacement = "\"", flags = "M" },

    # 4. Technical Noise Stripper (Cleans MDX attributes to help Audit tool)
    { regex = "(?m)^import.*?from.*$", replacement = "", flags = "M" },
    { regex = "\\s+[a-zA-Z0-9\\-]+=([\"'{].*?[\"'}]|[^\\s>]+)", replacement = "", flags = "M" },

    # 5. Admonition Promotion Block
    { regex = "(?m)^____\\n\\*(Note|Tip|Warning|Important|Caution)[:]?\\*[:]?\\s*(.*?)\\n____", replacement = "[\\1]\n====\n\\2\n====", hook = "uppercase_label", flags = "M" },

    # 6. Formatting & Space Recovery
    { regex = "([^\\n])\\s+\\.\\s+", replacement = "\\1\\n. ", flags = "M" },
    { regex = "\\[arabic\\]\\n", replacement = "" },
    { regex = "^\\..*?\\nimage::", replacement = "image::", flags = "M" },
    { regex = "\\+\\+\\[\\+\\+", replacement = "[" },
    { regex = "\\+\\+\\]\\+\\+", replacement = "]" },
    { regex = "PROTECTSPACE", replacement = " " },
    { regex = "SHIELDSEP", replacement = "\n" }
]

[tool.transpiler-pro.antora]
headers = []