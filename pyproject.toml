[project]
name = "transpiler-pro"
version = "1.0.0"
description = "Enterprise MD-to-ADOC conversion pipeline with SUSE learning engine"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Sushant Gaurav", email = "sushant-gaurav@suse.com"}]
keywords = ["documentation", "asciidoc", "markdown", "nlp", "vale", "suse"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "spacy>=3.7.0",
    "pytest>=9.0.3",
    "requests>=2.33.0",
    "pyyaml>=6.0.3",
    "markdown2>=2.5.5",
]

[project.urls]
Homepage = "https://github.com/your-username/transpiler-pro"
Documentation = "https://your-username.github.io/transpiler-pro/"

[project.scripts]
transpiler-pro = "transpiler_pro.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest-cov>=5.0.0",
    "pip-audit>=2.7.0",
    "ruff>=0.3.0",
    "pdoc>=14.0.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.transpiler-pro.pipeline]
supported_extensions = [".md", ".mdx"]
knowledge_base = "data/knowledge_base.json"
# Centralized source for the sync command
official_style_guide = "https://github.com/openSUSE/suse-vale-styleguide.git"

[tool.transpiler-pro.grammar]
special_verbs = { "setup" = "setting up", "stop" = "stopping", "check" = "checking", "reboot" = "rebooting", "backup" = "backing up", "fix" = "fixing", "finish" = "finishing" }

[tool.transpiler-pro.linter]
styles = ["Vale", "common", "asciidoc", "config"]
min_alert_level = "suggestion"
supported_formats = ["adoc", "md"]
report_title = "SUSE Style Guide Validation Report"
theme = { error = "red", warning = "yellow", suggestion = "blue" }

[tool.transpiler-pro.patterns]
suggestion_extraction = "['\"‘“’\u2018\u2019\u201c\u201d](.*?)['\"’\u2018\u2019\u201c\u201d]"
instead_of_trigger = "instead of"
removal_trigger = "removing"

[tool.transpiler-pro.conversions]
extension_map = { md = "adoc", mdx = "adoc" }
path_normalization = [{ regex = "^\\./", replacement = "" }]

# PHASE 1: SHIELDING (Lightweight & Safe)
shielding_patterns = [
    { regex = "(?m)^:::", replacement = "SHIELD_ADMON_MARK" },
    { regex = "<details(.*?)>", replacement = "SHIELD_DETAILS_START" },
    { regex = "</details>", replacement = "SHIELD_DETAILS_END" },
    { regex = "<summary(.*?)>", replacement = "SHIELD_SUMMARY_START" },
    { regex = "</summary>", replacement = "SHIELD_SUMMARY_END" },
    { regex = "<([A-Z][a-zA-Z0-9]*)([^>]*?)/>", replacement = "SHIELD_JSX_SELF_\\1_END" }
]

# PHASE 2: RESTORATION
restoration_patterns = [
    { regex = "SHIELD_ADMON_MARK", replacement = ":::" },
    { regex = "SHIELD_DETAILS_START", replacement = "<details>" },
    { regex = "SHIELD_DETAILS_END", replacement = "</details>" },
    { regex = "SHIELD_SUMMARY_START", replacement = "<summary>" },
    { regex = "SHIELD_SUMMARY_END", replacement = "</summary>" },
    { regex = "SHIELD_JSX_SELF_(.*?)_END", replacement = "<\\1 />" }
]

# PHASE 3: CLEANUP
cleanup_regex = [
    # --- PARITY FIXES (Fixes Pandoc noise in technical strings) ---
    
    # 1. Fix mangled Path Variables (e.g., APPLICATION++_++ID -> APPLICATION_ID)
    { regex = "([A-Z0-9]+)\\+\\+\\_\\+\\+([A-Z0-9]+)", replacement = "\\1_\\2", flags = "M" },
    
    # 2. Fix escaped wildcards in technical scopes (e.g., events.++*++ -> events.*)
    { regex = "\\.\\+\\+\\*\\+\\+", replacement = ".*", flags = "M" },
    
    # 3. Fix escaped braces/characters in inline JSON snippets (e.g., ++{++ -> {)
    { regex = "\\+\\+([{}*])\\+\\+", replacement = "\\1", flags = "M" },

    # 4. GLOBAL TECHNICAL UN-ESCAPE
    # We broaden this to ensure that any technical string 3+ chars long 
    # wrapped in pluses is released for the audit tool to see.
    { regex = "\\+\\+([a-zA-Z0-9_\\$\\-\\.\\*]+)\\+\\+", replacement = "\\1", flags = "M" },

    # 5. REFINED PASSTHROUGH CLEANUP
    # Only strips pluses if they are strictly surrounding alphanumeric technical slugs
    # to prevent recursive matching on complex AsciiDoc syntax.
    { regex = "(?<!\\+)\\+\\+([a-zA-Z0-9_\\$\\-\\.]+)\\+\\+(?!\\+)", replacement = "\\1", flags = "M" },

    # 6. HTML ENTITY RECOVERY (Fixes University/Template failures)
    # Reverts codes to characters so the Audit tool matches 'addition's' instead of 'addition&#x27;s'
    { regex = "&#x27;", replacement = "'", flags = "M" },
    { regex = "&quot;", replacement = "\"", flags = "M" },
    { regex = "&gt;", replacement = ">", flags = "M" },
    { regex = "&lt;", replacement = "<", flags = "M" },

    # 7. STRIP MDX IMPORTS (Noise Cleanup for Trigger/Workflow files)
    # Removes lines like 'import TriggerPayload from ...'
    { regex = "(?m)^import.*?from.*$", replacement = "", flags = "M" },

    # 8. GLOBAL TECHNICAL UN-ESCAPE (Final Boss Edition)
    # This now specifically allows for camelCase, dots, and common technical prefixes.
    # It will release words like ++removeColumn++, ++application.export++, ++$ne++
    { regex = "\\+\\+([a-zA-Z0-9_\\$\\-\\.\\*]+)\\+\\+", replacement = "\\1", flags = "M" },

    # 9. JSX TAG CLEANUP
    # Removes leftover React fragment artifacts (e.g., <p> or <span> around technical IDs)
    { regex = "<[/]?(span|p|strong|code).*?>", replacement = "", flags = "M" },

    # 10. SPAN & ALIGN CLEANUP (Fixes the remaining University/Device noise)
    # The audit mentioned 'span' and 'align' as missing—these are HTML artifacts.
    { regex = "<[/]?(span|div|p|align|style|font).*?>", replacement = "", flags = "M" },

    # --- STANDARD STRUCTURAL CLEANUP ---

    # Converts blockquotes into Admonition blocks; routes to 'uppercase_label' hook in Python
    { regex = "(?m)^____\\n\\*(Note|Tip|Warning|Important|Caution)[:]?\\*[:]?\\s*(.*?)\\n____", replacement = "[\\1]\n====\n\\2\n====", hook = "uppercase_label", flags = "M" },
    
    # Force newlines for squashed numbered list items (Fixes spacing issues)
    { regex = "([^\\n])\\s+\\.\\s+", replacement = "\\1\\n. ", flags = "M" },
    
    # Remove Pandoc list metadata and image captions
    { regex = "\\[arabic\\]\\n", replacement = "" },
    { regex = "^\\..*?\\nimage::", replacement = "image::", flags = "M" },
    
    # Strip Link noise and character escaping introduced by Pandoc
    { regex = "\\+\\+\\[\\+\\+", replacement = "[" },
    { regex = "\\+\\+\\]\\+\\+", replacement = "]" },
    
    # Handle marker cleanup for spaces and newlines
    { regex = "PROTECTSPACE", replacement = " " },
    { regex = "SHIELDSEP", replacement = "\n" }
]

[tool.transpiler-pro.antora]
headers = []
